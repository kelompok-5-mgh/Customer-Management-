<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Customer Management System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2>Buat Akun Baru</h2>
                <p>Daftar untuk mengakses sistem CRM</p>
            </div>

            <div id="alertMessage" class="alert-message" style="display: none;"></div>

            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <label for="regName"><i class="fa-regular fa-user"></i> Nama Lengkap</label>
                    <input type="text" id="regName" placeholder="Nama Lengkap Anda" required>
                </div>

                <div class="input-group">
                    <label for="regEmail"><i class="fa-regular fa-envelope"></i> Email</label>
                    <input type="email" id="regEmail" placeholder="nama@perusahaan.com" required>
                </div>

                <div class="input-group">
                    <label for="regPassword"><i class="fa-solid fa-lock"></i> Kata Sandi</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" placeholder="Minimal 6 karakter" required>
                        <i class="fa-regular fa-eye togglePassword" data-target="regPassword"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span class="btn-text">Daftar Akun</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Sudah punya akun? <a href="index.html">Masuk di sini</a></p>
            </div>
        </div>

        <div class="login-background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
