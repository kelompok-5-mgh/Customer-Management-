<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Customer Management System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Poppins & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-users-gear"></i>
                </div>
                <h2>CRM Portal</h2>
                <p>Silakan masuk ke akun Customer Management Anda</p>
            </div>

            <form id="loginForm" class="login-form">
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <div class="input-group">
                    <label for="email"><i class="fa-regular fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="nama@perusahaan.com" required>
                </div>

                <div class="input-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Kata Sandi</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" id="remember"> Ingat saya
                    </label>
                    <a href="#" class="forgot-password">Lupa kata sandi?</a>
                </div>

                <button type="submit" class="btn-submit">
                    <span class="btn-text">Masuk</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <p>Belum punya akses? <a href="#">Hubungi Administrator</a></p>
            </div>
        </div>
        <div class="login-background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
