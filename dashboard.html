<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dasbor – Relasi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171B4D'/%3E%3Ccircle cx='16' cy='13' r='4' fill='%230FA89A'/%3E%3Crect x='8' y='20' width='16' height='4' rx='2' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Font dimuat tanpa memblokir halaman; jika gagal, font sistem dipakai -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <header class="topbar">
    <a class="wordmark" href="dashboard.html" aria-label="Relasi">
      <span class="wordmark-mark">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="3.2"/><path d="M5.5 19c.8-3.2 3.4-4.8 6.5-4.8s5.7 1.6 6.5 4.8"/></svg>
      </span>
      Relasi
    </a>
    <button type="button" id="logout" class="btn btn-ghost">Keluar</button>
  </header>

  <main class="page">
    <p id="page-error" class="page-error" role="alert" hidden></p>

    <section class="welcome">
      <h1 id="welcome-title">Halo</h1>
      <p>Akun Anda aktif dan semua aktivitas tercatat di database. Menu pelanggan akan ditambahkan pada tahap berikutnya.</p>
    </section>

    <dl class="facts">
      <div><dt>Email</dt><dd id="fact-email">–</dd></div>
      <div><dt>Akun dibuat</dt><dd id="fact-created">–</dd></div>
      <div><dt>Total aktivitas</dt><dd id="fact-total">–</dd></div>
    </dl>

    <section class="activity-section" aria-labelledby="activity-title">
      <h2 id="activity-title">Aktivitas terbaru</h2>
      <ul id="activity-list" class="activity"></ul>
      <p id="activity-empty" class="empty" hidden>Belum ada aktivitas yang tercatat.</p>
    </section>
  </main>

  <script src="js/security.js"></script>
  <script src="js/db.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
